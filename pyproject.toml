[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposentry"
version = "0.1.0"
description = "Evidence-first CLI for repository and dependency safety review"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RepoSentry contributors" }]

[project.scripts]
reposentry = "reposentry.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
